name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Empacotar
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/FF-ESP.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: FF-ESP-apk
          path: out/FF-ESP.apk
